name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise_test
          POSTGRES_USER: enterprise
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U enterprise -d enterprise_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: "python -m pip install --only-binary=:all: -r requirements-test.txt"
      - run: python -m pip check
      - name: Backend tests on SQLite
        run: python -m pytest -q
      - name: Migrate fresh PostgreSQL and check schema drift
        env:
          DATABASE_URL: postgresql+psycopg://enterprise@127.0.0.1:${{ job.services.postgres.ports[5432] }}/enterprise_test
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Integration tests on migrated PostgreSQL
        env:
          ENTERPRISE_TEST_DATABASE_URL: postgresql+psycopg://enterprise@127.0.0.1:${{ job.services.postgres.ports[5432] }}/enterprise_test
        run: python -m pytest -q tests/test_workflows.py

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test the Compose stack
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          docker compose up --build --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:3000/api/health/live
          curl --fail --silent --show-error http://localhost:3000/api/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/
      - name: Stop the CI stack
        if: always()
        env:
          POSTGRES_PASSWORD: unused-for-teardown
        run: docker compose down
